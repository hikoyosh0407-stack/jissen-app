<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>実践5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<style>
:root{
  --bg:#111827; --card:#1F2937; --card2:#273449; --line:#374151;
  --txt:#F3F4F6; --sub:#9CA3AF; --acc:#34D399; --acc2:#60A5FA; --warn:#F59E0B; --pink:#F472B6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--txt);
  font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));}
header{position:sticky; top:0; z-index:10; background:rgba(17,24,39,.92);
  backdrop-filter:blur(8px); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
header h1{font-size:17px; margin:0}
header .sub{font-size:12px; color:var(--sub)}
main{padding:14px 14px 20px; max-width:560px; margin:0 auto}
.card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--line)}
h2{font-size:15px; margin:0 0 8px}
.muted{color:var(--sub); font-size:12px; line-height:1.6}
.btn{display:block; width:100%; padding:14px; border:none; border-radius:12px;
  background:var(--acc); color:#0B1220; font-size:16px; font-weight:700; cursor:pointer}
.btn.sec{background:var(--card2); color:var(--txt); border:1px solid var(--line)}
.btn.small{width:auto; padding:9px 14px; font-size:13px; display:inline-block; margin-right:6px}
.btn:active{opacity:.75}
a.btn{text-decoration:none; text-align:center}
/* 出典ピッカー */
.srclist{margin-top:6px; max-height:230px; overflow-y:auto; border:1px solid var(--line); border-radius:10px}
.srchit{padding:10px; border-bottom:1px solid var(--line); font-size:13px; line-height:1.4; cursor:pointer}
.srchit:last-child{border-bottom:none}
.srchit:active{background:var(--card2)}
.srchit .g{font-size:11px; color:var(--sub); margin-left:4px}
.srcchip{display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--acc2);
  border-radius:10px; padding:8px 10px; margin-top:6px; font-size:13px}
.srcchip .x{margin-left:auto; background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer}
/* action card */
.act{display:flex; gap:10px; align-items:flex-start}
.chk{width:46px; height:46px; border-radius:12px; border:1.5px solid var(--line); flex-shrink:0;
  background:transparent; color:var(--sub); font-size:22px; cursor:pointer}
.chk.on{background:var(--acc); border-color:var(--acc); color:#0B1220}
.act .body{flex:1; min-width:0}
.act .atext{font-size:15px; font-weight:700; line-height:1.45}
.act.done .atext{color:var(--sub); text-decoration:line-through}
.act .meta{font-size:12px; color:var(--sub); margin-top:5px; line-height:1.6}
.chip{display:inline-block; background:var(--card2); border-radius:99px; padding:1px 9px; font-size:11px; margin-right:4px}
.chip.retry{background:#4A3B12; color:var(--warn); font-weight:700}
.chip.mine{background:#4A1D3D; color:var(--pink); font-weight:700}
.srclink{color:var(--acc2); text-decoration:none; font-size:12px}
.swap{background:none; border:none; color:var(--sub); font-size:16px; padding:4px 6px; cursor:pointer; flex-shrink:0}
.win{background:linear-gradient(135deg,#065F46,#047857); border:1px solid var(--acc); border-radius:14px;
  padding:12px 14px; margin-bottom:12px; font-weight:800; font-size:15px; text-align:center}
.banner{background:#3B2A0B; border:1px solid var(--warn); border-radius:14px; padding:12px 14px;
  margin-bottom:12px; font-size:14px; font-weight:700; color:#FDE68A}
.banner button{margin-top:8px}
.progress{display:flex; gap:5px; margin:0 0 12px}
.progress i{flex:1; height:8px; border-radius:99px; background:var(--card2)}
.progress i.on{background:var(--acc)}
textarea,input.text,select.text{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--txt);
  border-radius:10px; padding:10px; font-size:15px; font-family:inherit; -webkit-appearance:none}
textarea{min-height:88px; resize:vertical}
label{font-size:12px; color:var(--sub); display:block; margin:8px 0 4px}
.row2{display:flex; gap:8px}
.row2 > *{flex:1; min-width:0}
.row2 .narrow{flex:0 0 96px}
/* photos */
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.thumb{position:relative; width:76px; height:76px; border-radius:10px; overflow:hidden;
  background:var(--card2); border:1px solid var(--line)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb .del{position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:99px;
  border:none; background:rgba(0,0,0,.65); color:#fff; font-size:13px; line-height:1; cursor:pointer}
.notephoto{width:100%; max-height:220px; object-fit:cover; object-position:top;
  border-radius:10px; margin-top:8px; display:block; cursor:zoom-in}
.notephoto.full{max-height:none; object-fit:contain; cursor:zoom-out}
/* inbox */
.note{border-top:1px solid var(--line); padding:12px 0}
.note:first-of-type{border-top:none}
.note .ndate{font-size:11px; color:var(--sub)}
.note .ntext{font-size:14px; line-height:1.6; margin:4px 0; white-space:pre-wrap}
.note .nsrc{font-size:12px; color:var(--acc2)}
.badge{display:inline-block; border-radius:99px; padding:1px 9px; font-size:11px; font-weight:700}
.badge.todo{background:#3B2A0B; color:var(--warn)}
.badge.made{background:#0B3B2A; color:var(--acc)}
.badge.kept{background:var(--card2); color:var(--sub)}
/* tracker */
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:6px 2px; text-align:center; border-bottom:1px solid var(--line)}
th{color:var(--sub); font-weight:600; font-size:11px}
td.wk{font-size:11px; color:var(--sub); text-align:left; white-space:nowrap}
.ok4{color:var(--acc); font-weight:800}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.kpi{background:var(--card2); border-radius:10px; padding:10px; text-align:center}
.kpi .big{font-size:22px; font-weight:800}
.kpi .lb{font-size:11px; color:var(--sub)}
.bankitem{padding:9px 0; border-top:1px solid var(--line); font-size:13px; line-height:1.5}
.bankitem .cnt{color:var(--acc); font-weight:700; font-size:12px}
.bankitem .grad{color:var(--warn)}
nav{position:fixed; bottom:0; left:0; right:0; display:flex; background:rgba(17,24,39,.95);
  backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); z-index:20}
nav button{flex:1; padding:10px 0 8px; background:none; border:none; color:var(--sub); font-size:10px; cursor:pointer; position:relative}
nav button .ico{display:block; font-size:19px; margin-bottom:2px}
nav button.on{color:var(--acc)}
nav .dot{position:absolute; top:6px; right:calc(50% - 18px); min-width:16px; height:16px; border-radius:99px;
  background:var(--warn); color:#1a1200; font-size:10px; font-weight:800; line-height:16px}
</style>
</head>
<body>
<header>
  <h1>🌱 実践5</h1>
  <div class="sub" id="hdate"></div>
</header>
<main id="main"></main>
<nav>
  <button id="nav-today" onclick="go('today')"><span class="ico">✅</span>今日</button>
  <button id="nav-learn" onclick="go('learn')"><span class="ico">💡</span>学び<span id="learndot"></span></button>
  <button id="nav-track" onclick="go('track')"><span class="ico">📈</span>記録</button>
  <button id="nav-bank" onclick="go('bank')"><span class="ico">📚</span>バンク</button>
  <button id="nav-set" onclick="go('set')"><span class="ico">⚙️</span>設定</button>
</nav>
<input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="addPhotos(this)">
<script src="jissen-data.js"></script>
<script src="unchiku-data.js"></script>
<script src="notes-data.js"></script>
<script>
const KEY = "jissen5-v1";
const GRAD = 7; // 完了7回で定着・卒業
const CUES = ["朝ノートを開いたとき","昼食","昼休み","仕事に着手する前","トレ前後","帰宅直後","夕食","寝る前","気づいた瞬間"];

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.history) return s; }catch(e){}
  return {history:{}};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
let state = load();
state.notes = state.notes || [];      // 学びメモ(受信箱)
state.custom = state.custom || [];    // 学びから作った自分専用アクション
state.draft = state.draft || {text:"", src:"", page:"", photos:[]};
state.draft.srcPath = state.draft.srcPath || "";   // Vault内の既存ノート(出典)
let view = "today";
let making = null;   // 実践化フォームを開いているノートID
let srcHits = [];    // 出典ピッカーの検索結果

/* ---------- date utils ---------- */
function today(){ const d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); }
function dow(s){ return new Date(s+"T12:00:00").getDay(); } // 0=日
const DOWJ = ["日","月","火","水","木","金","土"];

/* ---------- photo store (IndexedDB) ---------- */
let dbp = null;
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    const r = indexedDB.open("jissen5-photos", 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("photos")) r.result.createObjectStore("photos"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function putPhoto(key, blob){
  const d = await db();
  return new Promise((res,rej)=>{ const t=d.transaction("photos","readwrite"); t.objectStore("photos").put(blob,key); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
}
async function getPhoto(key){
  if(photoCache[key]) return photoCache[key];
  const d = await db();
  const b = await new Promise((res,rej)=>{ const t=d.transaction("photos","readonly"); const q=t.objectStore("photos").get(key); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  if(b) photoCache[key] = b;
  return b;
}
async function delPhoto(key){
  delete photoCache[key];
  const d = await db();
  return new Promise((res,rej)=>{ const t=d.transaction("photos","readwrite"); t.objectStore("photos").delete(key); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
}
const photoCache = {};   // key -> Blob(共有をユーザー操作直後に走らせるためのキャッシュ)
let objUrls = [];

function resizeImage(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, max/Math.max(w,h));
      w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("toBlob failed")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

/* ---------- actions pool (バンク + 自分の学び) ---------- */
function allActions(){ return BANK.concat(state.custom||[]); }
function findAct(id){ return allActions().find(a=>a.id===id); }

/* ---------- stats ---------- */
function doneCount(id){
  let n=0; for(const d in state.history){ if((state.history[d].done||[]).includes(id)) n++; }
  return n;
}
function lastIssued(id, before){
  let last=null;
  for(const d in state.history){ if(d<before && (state.history[d].items||[]).includes(id)) if(!last||d>last) last=d; }
  return last;
}
function everIssued(id){
  for(const d in state.history){ if((state.history[d].items||[]).includes(id)) return true; }
  return false;
}
function consecIssued(id, date){
  let n=0, d=addDays(date,-1);
  while(state.history[d] && (state.history[d].items||[]).includes(id)){ n++; d=addDays(d,-1); }
  return n;
}

/* ---------- daily selection ---------- */
function seededRand(seed){ let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0; return ()=>{ h=(h*1103515245+12345)>>>0; return h/4294967296; }; }

function eligible(pool, date, exclude){
  const wd = dow(date);
  let cand = pool.filter(a => !exclude.includes(a.id) && doneCount(a.id) < GRAD && (!a.wd || a.wd.includes(wd)));
  // 直近7日に出題したものは避ける(足りなければ解除)
  let fresh = cand.filter(a => { const l = lastIssued(a.id, date); return !l || addDays(l,7) <= date; });
  if(!fresh.length) fresh = cand;
  if(!fresh.length) fresh = pool.filter(a => !exclude.includes(a.id) && doneCount(a.id) < GRAD);
  // 自分の学びから作った未出題のアクションは最優先(学び→実践のループを早く閉じる)
  const brandNew = fresh.filter(a => a.custom && !everIssued(a.id));
  return brandNew.length ? brandNew : fresh;
}
function pick(pool, date, exclude, rnd){
  const c = eligible(pool, date, exclude);
  return c.length ? c[Math.floor(rnd()*c.length)] : null;
}
function pickUnchiku(date, rnd, exclude){
  const used = {};
  for(const d in state.history){
    const u = (state.history[d].items||[]).find(i=>i.startsWith("U:"));
    if(u && addDays(d,14) > date) used[u]=1;
  }
  let c = UNCHIKU.filter(u => !used["U:"+u.t] && !(exclude||[]).includes("U:"+u.t));
  if(!c.length) c = UNCHIKU;
  return c[Math.floor(rnd()*c.length)];
}
function generateDay(date){
  const rnd = seededRand(date);
  const all = allActions();
  const items = [];
  // リトライ: 前日の未完から1つ(連続3日まで)
  const prev = state.history[addDays(date,-1)];
  let retry = null;
  if(prev){
    const undone = (prev.items||[]).filter(i => !i.startsWith("U:") && !(prev.done||[]).includes(i) && consecIssued(i,date) < 3 && doneCount(i) < GRAD && findAct(i));
    if(undone.length) retry = undone[Math.floor(rnd()*undone.length)];
  }
  const slots = [
    all.filter(a=>a.cat==="体"),
    all.filter(a=>a.cat==="習慣"),
    all.filter(a=>a.cat==="時間"),
    all.filter(a=>["人","副業"].includes(a.cat)).concat(all.filter(a=>["体","習慣","時間"].includes(a.cat)))
  ];
  if(retry){
    items.push(retry);
    const cat = findAct(retry).cat;
    const idx = {"体":0,"習慣":1,"時間":2}[cat];
    if(idx !== undefined) slots.splice(idx,1); else slots.splice(3,1);
  }
  for(const pool of slots){
    if(items.length>=4) break;
    const a = pick(pool, date, items, rnd);
    if(a) items.push(a.id);
  }
  items.push("U:"+pickUnchiku(date, rnd, items).t);
  return {items, done:[], refl:{t:"",d:"",n:""}, retry};
}
function getDay(date){
  if(!state.history[date]) { state.history[date] = generateDay(date); save(); }
  return state.history[date];
}

/* ---------- obsidian link ---------- */
function obsLink(path){ return "obsidian://open?vault="+encodeURIComponent(VAULT)+"&file="+encodeURIComponent(path); }
function unchikuByTitle(t){ return UNCHIKU.find(u=>u.t===t); }

/* ---------- render ---------- */
function go(v){ view=v; making=null; render(); window.scrollTo(0,0); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pendingNotes(){ return (state.notes||[]).filter(n => n.status === "todo"); }

function render(){
  document.getElementById("hdate").textContent = today() + "(" + DOWJ[dow(today())] + ")";
  for(const id of ["today","learn","track","bank","set"]) document.getElementById("nav-"+id).className = (view===id)?"on":"";
  const np = pendingNotes().length;
  document.getElementById("learndot").outerHTML = np
    ? `<span class="dot" id="learndot">${np}</span>` : `<span id="learndot"></span>`;
  objUrls.forEach(u=>URL.revokeObjectURL(u)); objUrls = [];
  const m = document.getElementById("main");
  if(view==="today") m.innerHTML = renderToday();
  else if(view==="learn") m.innerHTML = renderLearn();
  else if(view==="track") m.innerHTML = renderTrack();
  else if(view==="bank") m.innerHTML = renderBank();
  else m.innerHTML = renderSet();
  hydratePhotos();
}
async function hydratePhotos(){
  for(const el of document.querySelectorAll("img[data-photo]")){
    const b = await getPhoto(el.dataset.photo);
    if(b){ const u = URL.createObjectURL(b); objUrls.push(u); el.src = u; }
  }
}

function itemHtml(i, day, date){
  const done = (day.done||[]).includes(i);
  const retryChip = (day.retry===i) ? '<span class="chip retry">🔁 リトライ</span>' : "";
  if(i.startsWith("U:")){
    const t = i.slice(2), u = unchikuByTitle(t);
    return `<div class="card"><div class="act ${done?"done":""}">
      <button class="chk ${done?"on":""}" onclick="toggle('${date}','${i.replace(/'/g,"\\'")}')">${done?"✓":""}</button>
      <div class="body">
        <div class="atext">🗣️ 「${esc(t)}」を誰かに話す</div>
        <div class="meta"><span class="chip">昼休み/夕食の雑談</span>${retryChip}<br>
        📖 <a class="srclink" href="${u?obsLink(u.p):"#"}">うんちくノートを開く</a></div>
      </div>
      <button class="swap" onclick="swapItem('${date}','${i.replace(/'/g,"\\'")}')" title="別のにする">🔄</button>
    </div></div>`;
  }
  const a = findAct(i);
  if(!a) return "";
  const srcHtml = (a.custom && !a.src)
    ? `✍️ <span class="srclink">${esc(a.srcName)}</span>`
    : `${a.custom?"✍️":"📖"} <a class="srclink" href="${obsLink(a.src)}">${esc(a.srcName)}</a>`;
  const mineChip = a.custom ? '<span class="chip mine">✍️ 自分の学び</span>' : "";
  return `<div class="card"><div class="act ${done?"done":""}">
    <button class="chk ${done?"on":""}" onclick="toggle('${date}','${i}')">${done?"✓":""}</button>
    <div class="body">
      <div class="atext">${a.emoji} ${esc(a.action)}</div>
      <div class="meta">👣 一歩: ${esc(a.step)}<br>
      <span class="chip">⏰ ${esc(a.cue)}</span>${mineChip}${retryChip}<br>
      ${srcHtml}</div>
    </div>
    <button class="swap" onclick="swapItem('${date}','${i}')" title="別のにする">🔄</button>
  </div></div>`;
}

function weekendBanner(){
  const np = pendingNotes().length;
  if(!np) return "";
  const wd = dow(today());
  if(wd===6 || wd===0)
    return `<div class="banner">📥 今週の学びが${np}件たまっています。<br>週末のうちに「実践」に変えておくと、来週から出題されます。
      <button class="btn small" onclick="go('learn')">受信箱を開く</button></div>`;
  return "";
}

function renderToday(){
  const date = today();
  const day = getDay(date);
  const n = (day.done||[]).length;
  let h = weekendBanner();
  h += `<div class="progress">${day.items.map(i=>`<i class="${(day.done||[]).includes(i)?"on":""}"></i>`).join("")}</div>`;
  if(n>=1) h += `<div class="win">🏆 今日は勝ち!(${n}/5)${n===5?" — 全制覇🎉":""}</div>`;
  else h += `<div class="muted" style="margin-bottom:12px">1つでもできれば今日は勝ち。全部やらなくていい。</div>`;
  h += day.items.map(i=>itemHtml(i, day, date)).join("");
  h += `<div class="card"><h2>🌙 振り返り(3行だけ)</h2>
    <label>試したこと</label><input class="text" value="${esc(day.refl.t)}" onchange="refl('${date}','t',this.value)">
    <label>どうだった?</label><input class="text" value="${esc(day.refl.d)}" onchange="refl('${date}','d',this.value)">
    <label>次どう変える?</label><input class="text" value="${esc(day.refl.n)}" onchange="refl('${date}','n',this.value)"></div>`;
  return h;
}

/* ---------- 学びタブ ---------- */
function renderLearn(){
  const d = state.draft;
  let h = weekendBanner();
  h += `<div class="card"><h2>✍️ 今日の学びをメモ</h2>
    <div class="muted">読んでて刺さった一文・気づき・ページ写真。実践に変えるのは週末でいい。</div>
    <label>気づき・学んだこと</label>
    <textarea id="dtext" placeholder="例: 集中力が切れるのは意志の問題じゃなく環境。机の上に物を置かない。" oninput="syncDraft()">${esc(d.text)}</textarea>
    <div class="row2">

      ? `<a class="btn sec small" href="${appendUrl(n)}" onclick="markAppended(${n.id})">➕ 出典ノートに追記</a>` : "";

function weekRows(){
  // W1 = CHALLENGE_START の週の月曜から6週
  let mon = CHALLENGE_START;
  while(dow(mon)!==1) mon = addDays(mon,-1);
  const rows=[];
  for(let w=0; w<6; w++){
    const days=[]; let cnt=0;
    for(let i=0;i<7;i++){
      const d = addDays(mon, w*7+i);
      const rec = state.history[d];
      let mark="・";
      if(rec){ if((rec.done||[]).length>=1){ mark="⭕"; cnt++; } else if(d<today()) mark="✖"; else mark="・"; }
      else if(d < CHALLENGE_START) mark="-";
      days.push(mark);
    }
    rows.push({w:w+1, start:addDays(mon,w*7), days, cnt});
  }
  return rows;
}

function buildMd(){
  const rows = weekRows();
  let md = `---\ntags: 実践5\ntype: app-log\nupdated: ${today()}\n---\n# 📱 実践ログ(アプリ)\n\n実践5アプリからの書き出し。最新が上書きされる。\n\n## 🎯 週4×6週トラッカー(${CHALLENGE_START}〜)\n\n|週|開始|月|火|水|木|金|土|日|計|\n|---|---|---|---|---|---|---|---|---|---|\n`;
  for(const r of rows) md += `|W${r.w}|${r.start.slice(5)}|${r.days.join("|")}|${r.cnt}${r.cnt>=4?" ✅":""}|\n`;
  md += `\n## 🗓️ デイリー記録\n\n`;
  const dates = Object.keys(state.history).sort().reverse();
  for(const d of dates){
    const rec = state.history[d];
    md += `### ${d}(${(rec.done||[]).length}/5)\n`;
    for(const i of rec.items||[]){
      const done = (rec.done||[]).includes(i);
      if(i.startsWith("U:")){
        const u = unchikuByTitle(i.slice(2));
        md += `- [${done?"x":" "}] 🗣️ ${i.slice(2)} 📖 [[${u?u.p:i.slice(2)}|うんちく]]\n`;
      } else {
        const a = findAct(i);
        if(a) md += `- [${done?"x":" "}] ${a.emoji} ${a.action} ${a.custom?`✍️ ${a.srcName}`:`📖 [[${a.src}|${a.srcName}]]`}\n`;
      }
    }
    if(rec.refl && (rec.refl.t||rec.refl.d||rec.refl.n))
      md += `- 試した: ${rec.refl.t||""} / どうだった: ${rec.refl.d||""} / 次: ${rec.refl.n||""}\n`;
    md += `\n`;
  }
  return md;
}

async function shareFiles(files, fallbackText, label){
  try{
    if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files}); return true; }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  try{ await navigator.clipboard.writeText(fallbackText); alert(label+"をコピーしました(写真は共有できませんでした)"); }
  catch(e){ alert("共有できませんでした"); }
  return false;
}
async function exportMd(){
  const md = buildMd();
  await shareFiles([new File([md], "実践ログ_アプリ.md", {type:"text/markdown"})], md, "Markdown");
}
async function exportNotes(all){
  const md = buildNotesMd();
  const files = [new File([md], "学びメモ_アプリ.md", {type:"text/markdown"})];
  for(const n of state.notes||[]){
    if(!all && n.exported) continue;

  const ok = await shareFiles(files, md, "学びメモ");
  if(ok){ for(const n of state.notes||[]) n.exported = true; save(); render(); }
}

/* ---------- actions ---------- */
function toggle(date, id){
  const day = getDay(date);
  day.done = day.done||[];
  const k = day.done.indexOf(id);
  if(k>=0) day.done.splice(k,1); else day.done.push(id);
  save(); render();
}
function swapItem(date, id){
  const day = getDay(date);
  const rnd = seededRand(date + "#" + Date.now());
  let repl = null;
  if(id.startsWith("U:")) repl = "U:"+pickUnchiku(date, rnd, day.items).t;
  else {
    const a = findAct(id);
    const pool = allActions().filter(x=>x.cat===(a?a.cat:"習慣"));
    const p = pick(pool, date, day.items, rnd) || pick(allActions(), date, day.items, rnd);
    if(p) repl = p.id;
  }
  if(!repl) { alert("代わりの候補がありません"); return; }
  const k = day.items.indexOf(id);
  day.items[k] = repl;
  day.done = (day.done||[]).filter(x=>x!==id);
  if(day.retry===id) day.retry=null;
  save(); render();
}
function refl(date, k, v){ const day=getDay(date); day.refl=day.refl||{t:"",d:"",n:""}; day.refl[k]=v; save(); }

/* ---------- 学びメモ ---------- */
function syncDraft(){
  const t=document.getElementById("dtext"), s=document.getElementById("dsrc"), p=document.getElementById("dpage");
  if(t) state.draft.text = t.value;
  if(s){
    if(state.draft.srcPath && s.value !== state.draft.src) state.draft.srcPath = ""; // 手打ちで変えたら紐付けを外す
    state.draft.src = s.value;
  }
  if(p) state.draft.page = p.value;
  save();
}
/* 出典ピッカー: Vault内の既存ノート(Books/D-Lab/TAKAHIRO)を検索して紐付ける */
function srcSearch(q){
  const box = document.getElementById("srclist");
  if(!box) return;
  q = (q||"").trim().toLowerCase();
  if(q.length < 2 || state.draft.srcPath){ box.innerHTML = ""; srcHits = []; return; }
  srcHits = SRCNOTES.filter(n => n.t.toLowerCase().includes(q)).slice(0, 12);
  box.innerHTML = srcHits.length
    ? `<div class="srclist">` + srcHits.map((n,i)=>
        `<div class="srchit" onclick="pickSrc(${i})">${esc(n.t)}<span class="g">${esc(n.g)}</span></div>`).join("") + `</div>`
    : `<div class="muted" style="margin-top:6px">一致するノートなし(このまま自由入力でもOK)</div>`;
}
function pickSrc(i){
  const n = srcHits[i];
  if(!n) return;
  state.draft.src = n.t;
  state.draft.srcPath = n.p;
  srcHits = [];
  save(); render();
}
function clearSrc(){
  state.draft.srcPath = "";
  save(); render();
}
async function addPhotos(input){
  const files = Array.from(input.files||[]);
  input.value = "";
  if(!files.length) return;
  syncDraft();
  for(const f of files){
    try{
      const blob = await resizeImage(f, 1400, 0.72);
      const key = "p"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
      await putPhoto(key, blob);
      photoCache[key] = blob;
      state.draft.photos.push(key);
    }catch(e){ alert("写真を追加できませんでした: "+(e.message||e)); }
  }
  save(); render();
}
async function rmDraftPhoto(i){
  const k = state.draft.photos[i];
  state.draft.photos.splice(i,1);
  save(); render();
  if(k) await delPhoto(k);
}
function saveNote(){
  syncDraft();
  const d = state.draft;
  if(!d.text.trim() && !d.photos.length){ alert("気づきを1行、または写真を入れてください"); return; }
  state.notes.push({
    id: Date.now(), date: today(), text: d.text.trim(),
    src: d.src.trim(), srcPath: d.srcPath||"", page: d.page.trim(), photos: d.photos.slice(),
    status: "todo", actionId: null, exported: false, appended: false
  });
  state.draft = {text:"", src:"", page:"", photos:[], srcPath:""};
  save(); render();
}

function appendBlock(n){

  let s = `\n> [!note] 📱 実践5メモ ${n.date}\n> ${n.text.replace(/\n/g, "\n> ")}\n`;
  if(n.page) s += `> — p.${n.page}\n`;
  if(a) s += `> - 🌱 実践: **${a.action}**(一歩: ${a.step} / ${a.cue})\n`;
  if(n.exported) for(const [i,k] of (n.photos||[]).entries()) s += `> ![[${photoName(n,i)}]]\n`;
  return s;
}
function appendUrl(n){
  return "obsidian://new?vault=" + encodeURIComponent(VAULT)
    + "&file=" + encodeURIComponent(n.srcPath)
    + "&append=true&content=" + encodeURIComponent(appendBlock(n));
}
function markAppended(id){
  const n = state.notes.find(x=>x.id===id);
  if(n){ n.appended = true; save(); }   // Obsidianへ遷移するのでここでは再描画しない
}
function keepNote(id){
  const n = state.notes.find(x=>x.id===id);
  if(n){ n.status = "kept"; save(); render(); }
}
async function delNote(id){
  if(!confirm("このメモを削除しますか?(写真も消えます)")) return;
  const i = state.notes.findIndex(x=>x.id===id);
  if(i<0) return;
  const n = state.notes[i];
  state.notes.splice(i,1);
  save(); making=null; render();
  for(const k of n.photos||[]) await delPhoto(k);
}
function nextCustomId(){
  let n = 1;
  const used = new Set((state.custom||[]).map(a=>a.id));
  while(used.has("M"+String(n).padStart(2,"0"))) n++;
  return "M"+String(n).padStart(2,"0");
}
const CAT_EMOJI = {"体":"💪","習慣":"🧠","時間":"⏰","人":"🤝","副業":"💰"};
function makeAction(noteId){
  const n = state.notes.find(x=>x.id===noteId);
  if(!n) return;
  const action = document.getElementById("mact").value.trim();
  const step = document.getElementById("mstep").value.trim();
  const cue = document.getElementById("mcue").value;
  const cat = document.getElementById("mcat").value;
  if(!action){ alert("試す行動を書いてください"); return; }
  if(!step){ alert("最初の一歩(2分以内)を書いてください。ここが小さいほど続きます"); return; }
  const id = nextCustomId();
  state.custom.push({
    id, cat, emoji: CAT_EMOJI[cat]||"🌱", action, step, cue,
    custom: true, noteId,
    src: n.srcPath || "",
    srcName: (n.src ? n.src + (n.page?` p.${n.page}`:"") : "自分の学び") + `(${n.date})`
  });
  n.status = "made"; n.actionId = id;
  making = null;
  save(); render();
  alert("追加しました。明日の実践5に優先的に出てきます。");
}
function delCustom(id){
  if(!confirm("このアクションを削除しますか?(学びメモは残ります)")) return;
  const i = (state.custom||[]).findIndex(a=>a.id===id);
  if(i>=0) state.custom.splice(i,1);
  for(const n of state.notes||[]) if(n.actionId===id){ n.actionId=null; n.status="todo"; }
  save(); render();
}

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
